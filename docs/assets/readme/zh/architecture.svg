<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" role="img">
  <title>gis-plugin 的位置：宿主、外壳、引擎与约定文件</title>
  <style>
    .bg { fill: #ffffff; stroke: #d0d7de; }
    .box { fill: #f6f8fa; stroke: #d0d7de; }
    .shell { fill: #eef4ff; stroke: #4f7fd9; }
    .sub { fill: #ffffff; stroke: #b6c8ee; }
    .dashed { stroke-dasharray: 5 4; }
    .t { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif; fill: #1f2328; }
    .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'PingFang SC', 'Noto Sans Mono CJK SC', 'Microsoft YaHei', monospace; fill: #1f2328; white-space: pre; }
    .muted { fill: #59636e; }
    .accent { fill: #2f5fb3; }
    .deny { fill: #b42318; }
    .line { stroke: #8c959f; fill: none; }
    .arrow { fill: #8c959f; }
    .pill { fill: #e7ecf3; }
    .pill-deny { fill: #fde8e7; }
    .pill-ok { fill: #e6f4ea; }
    .bubble { fill: #f6f8fa; stroke: #d0d7de; }
    .ctx { fill: #f3f7ff; stroke: #c9d8f5; }
    .err { fill: #fff5f4; stroke: #f3c3bf; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; stroke: #30363d; }
      .box { fill: #161b22; stroke: #30363d; }
      .shell { fill: #13213a; stroke: #4f7fd9; }
      .sub { fill: #0d1117; stroke: #2c4673; }
      .t, .m { fill: #e6edf3; }
      .muted { fill: #9198a1; }
      .accent { fill: #8fb4ff; }
      .deny { fill: #ff8a80; }
      .line { stroke: #6e7681; }
      .arrow { fill: #6e7681; }
      .pill { fill: #21262d; }
      .pill-deny { fill: #3d1d1b; }
      .pill-ok { fill: #17301f; }
      .bubble { fill: #161b22; stroke: #30363d; }
      .ctx { fill: #111c2e; stroke: #22385c; }
      .err { fill: #261515; stroke: #5c2b27; }
    }
  </style>
  <rect class="bg" x="0.5" y="0.5" width="899" height="639" rx="12"/>
  <text x="40" y="44" class="t muted" font-size="13" font-weight="600">Agent 宿主</text>
  <rect class="box" x="70.0" y="58" width="236" height="44" rx="8"/>
  <text x="188.0" y="86" class="t" font-size="15" font-weight="600" text-anchor="middle">Claude Code</text>
  <rect class="box" x="332.0" y="58" width="236" height="44" rx="8"/>
  <text x="450.0" y="86" class="t" font-size="15" font-weight="600" text-anchor="middle">Codex</text>
  <rect class="box" x="594.0" y="58" width="236" height="44" rx="8"/>
  <text x="712.0" y="86" class="t" font-size="15" font-weight="600" text-anchor="middle">DeepSeek Harness</text>
  <path class="line" stroke-width="1.5" d="M450.0 104 V139"/>
  <path class="arrow" d="M445.0 138 L455.0 138 L450.0 146 Z"/>
  <text x="462.0" y="130" class="m muted" font-size="12">插件清单 · skills · hooks.json</text>
  <rect class="shell" x="40" y="148" width="820" height="214" rx="12" stroke-width="1.5"/>
  <text x="62" y="182" class="m accent" font-size="20" font-weight="700">gis-plugin</text>
  <text x="198.0" y="181" class="t muted" font-size="13">薄外壳：不读写 GIS 数据，hooks 只用 Python 标准库</text>
  <rect class="sub" x="62" y="204" width="183" height="136" rx="8"/>
  <text x="78" y="232" class="t accent" font-size="15" font-weight="700">hooks</text>
  <text x="78" y="260" class="t" font-size="13">元数据卡片注入</text>
  <text x="78" y="284" class="t" font-size="13">源数据保护</text>
  <text x="78" y="308" class="t" font-size="13">项目样式 · 产物用语</text>
  <rect class="sub" x="259" y="204" width="183" height="136" rx="8"/>
  <text x="275" y="232" class="t accent" font-size="15" font-weight="700">约定</text>
  <text x="275" y="260" class="m" font-size="13">contracts/ 格式说明</text>
  <text x="275" y="284" class="m" font-size="13">JSON Schema</text>
  <text x="275" y="308" class="t" font-size="13">版本配对规则</text>
  <rect class="sub" x="456" y="204" width="183" height="136" rx="8"/>
  <text x="472" y="232" class="t accent" font-size="15" font-weight="700">诊断</text>
  <text x="472" y="260" class="m" font-size="13">/gis-doctor</text>
  <text x="472" y="284" class="t" font-size="13">引擎版本与能力</text>
  <text x="472" y="308" class="t" font-size="13">已装 skill 是否落后</text>
  <rect class="sub" x="653" y="204" width="183" height="136" rx="8"/>
  <text x="669" y="232" class="t accent" font-size="15" font-weight="700">评测</text>
  <text x="669" y="260" class="m" font-size="13">evals/</text>
  <text x="669" y="284" class="t" font-size="13">有无外壳对照</text>
  <text x="669" y="308" class="t" font-size="13">只评外壳的能力</text>
  <path class="line" stroke-width="1.5" d="M188.0 364 V429"/>
  <path class="arrow" d="M183.0 428 L193.0 428 L188.0 436 Z"/>
  <path class="line" stroke-width="1.5" d="M450.0 364 V429"/>
  <path class="arrow" d="M445.0 428 L455.0 428 L450.0 436 Z"/>
  <path class="line" stroke-width="1.5" d="M712.0 364 V429"/>
  <path class="arrow" d="M707.0 428 L717.0 428 L712.0 436 Z"/>
  <rect class="bg" x="307.4" y="388" width="285.2" height="24" rx="6" stroke="none"/>
  <text x="450.0" y="404" class="t muted" font-size="13" text-anchor="middle">CLI（--json）：外壳与引擎之间唯一的接口</text>
  <rect class="box" x="70.0" y="438" width="236" height="78" rx="8"/>
  <text x="86.0" y="468" class="m" font-size="16" font-weight="700">gis-kit</text>
  <rect class="pill-ok" x="245.0" y="452" width="49" height="22" rx="11"/>
  <text x="269.5" y="467" class="t muted" font-size="11" text-anchor="middle">已公开</text>
  <text x="86.0" y="496" class="t muted" font-size="13">算、转换、写新数据</text>
  <rect class="box" x="332.0" y="438" width="236" height="78" rx="8"/>
  <text x="348.0" y="468" class="m" font-size="16" font-weight="700">gis-view</text>
  <rect class="pill" x="496.0" y="452" width="60" height="22" rx="11"/>
  <text x="526.0" y="467" class="t muted" font-size="11" text-anchor="middle">私有开发</text>
  <text x="348.0" y="496" class="t muted" font-size="13">看、选、审阅</text>
  <rect class="box" x="594.0" y="438" width="236" height="78" rx="8"/>
  <text x="610.0" y="468" class="m" font-size="16" font-weight="700">gis-composer</text>
  <rect class="pill" x="758.0" y="452" width="60" height="22" rx="11"/>
  <text x="788.0" y="467" class="t muted" font-size="11" text-anchor="middle">私有开发</text>
  <text x="610.0" y="496" class="t muted" font-size="13">出正式图和影片</text>
  <path class="line dashed" stroke-width="1.5" d="M188.0 518 V548"/>
  <path class="line dashed" stroke-width="1.5" d="M450.0 518 V548"/>
  <path class="line dashed" stroke-width="1.5" d="M712.0 518 V548"/>
  <rect class="box dashed" x="40" y="548" width="820" height="56" rx="10"/>
  <text x="62" y="572" class="t" font-size="14" font-weight="700">约定文件</text>
  <text x="132" y="572" class="m muted" font-size="12">sources · semantics · describe · class-scheme · display-vector · map-style …</text>
  <text x="62" y="593" class="t muted" font-size="12">引擎之间不互相调用，只通过文件衔接；每个引擎脱离外壳也完整可用</text>
</svg>
